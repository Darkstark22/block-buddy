<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tiny Block Puzzle</title>
  <style>
    :root { color-scheme: light; --ink:#273044; --muted:#667085; --paper:#f7f5ef; --blue:#6387db; --green:#79b997; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--paper); color:var(--ink); font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { width:min(100%,520px); text-align:center; }
    .eyebrow { margin:0 0 4px; color:var(--muted); font-size:.8rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; }
    h1 { margin:0; font-size:clamp(2rem,8vw,3rem); letter-spacing:-.05em; }
    .intro { margin:8px auto 20px; max-width:370px; color:var(--muted); }
    .game-card { padding:clamp(14px,4vw,24px); border:1px solid #e6e2d7; border-radius:24px; background:#fff; box-shadow:0 12px 36px #37362412; }
    .topline { display:flex; justify-content:space-between; align-items:center; gap:12px; margin:0 auto 14px; max-width:340px; }
    #status { min-height:1.5em; font-weight:700; }
    #moves { color:var(--muted); font-size:.92rem; white-space:nowrap; }
    .board { display:grid; grid-template-columns:repeat(6,1fr); gap:8px; width:min(100%,340px); margin:auto; padding:10px; border-radius:18px; background:#e9edf4; touch-action:manipulation; }
    .cell { aspect-ratio:1; display:grid; place-items:center; border-radius:11px; background:#f7f8fa; }
    .wall { background:#45536d; box-shadow:inset 0 -5px #354158; }
    .goal { background:#e8f4eb; }
    .goal::after { content:"★"; color:#77ad87; font-size:1.6rem; }
    .box { width:72%; height:72%; border-radius:8px; background:#e9ae5c; box-shadow:inset 0 -5px #ce8f3f; }
    .player { width:60%; height:60%; border:5px solid #6387db; border-radius:50%; background:#dfe8ff; box-shadow:inset 0 0 0 3px white; }
    .player.on-goal { border-color:#459c68; background:#d5efdc; }
    .controls { display:flex; flex-wrap:wrap; justify-content:center; gap:9px; margin-top:16px; }
    button { border:0; border-radius:12px; padding:10px 15px; color:var(--ink); background:#eef1f7; font:inherit; font-weight:700; cursor:pointer; }
    button:hover { background:#e2e8f3; }
    button:focus-visible { outline:3px solid #6387db; outline-offset:2px; }
    .hint { margin:14px 0 0; color:var(--muted); font-size:.9rem; }
    .mobile-controls { display:grid; grid-template-columns:repeat(3,48px); grid-template-rows:repeat(2,42px); gap:5px; justify-content:center; margin:12px auto 0; }
    .mobile-controls button { padding:0; font-size:1.2rem; }
    .mobile-controls button:nth-child(1) { grid-column:2; }
    .mobile-controls button:nth-child(2) { grid-column:1; grid-row:2; }
    .mobile-controls button:nth-child(3) { grid-column:2; grid-row:2; }
    .mobile-controls button:nth-child(4) { grid-column:3; grid-row:2; }
    @media (min-width:600px) { .mobile-controls { display:none; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">A tiny block puzzle</p>
    <h1>Block Buddy</h1>
    <p class="intro">Push the wooden block onto the star. You can push it, but you can’t pull it!</p>
    <section class="game-card" aria-label="Block Buddy game">
      <div class="topline"><span id="level-label">Puzzle 1 of 5</span><span id="moves">Moves: 0</span></div>
      <p id="status" aria-live="polite">Ready when you are!</p>
      <div id="board" class="board" role="grid" aria-label="Puzzle board"></div>
      <div class="controls">
        <button id="undo" type="button">↶ Undo</button>
        <button id="reset" type="button">↻ Start over</button>
        <button id="next" type="button" hidden>Next puzzle →</button>
      </div>
      <div class="mobile-controls" aria-label="Move controls">
        <button type="button" data-dir="up" aria-label="Move up">↑</button>
        <button type="button" data-dir="left" aria-label="Move left">←</button>
        <button type="button" data-dir="down" aria-label="Move down">↓</button>
        <button type="button" data-dir="right" aria-label="Move right">→</button>
      </div>
      <p class="hint">Use the arrow keys or W A S D. R starts over.</p>
    </section>
  </main>
  <script>
    // # = wall, . = empty floor, G = goal
    const scenarios = [
      { name:"Around the corner", map:["######", "#....#", "#...G#", "#.B..#", "#P...#", "######"], player:{x:1,y:3}, box:{x:2,y:3} },
      { name:"Up, up, and away", map:["######", "#.G..#", "#....#", "#.B..#", "#.P..#", "######"], player:{x:2,y:4}, box:{x:2,y:3} },
      { name:"Straight across", map:["######", "#....#", "#....#", "#...G#", "#....#", "######"], player:{x:1,y:3}, box:{x:2,y:3} },
      { name:"Find your way around", map:["######", "#....#", "#..#.#", "#...G#", "#....#", "######"], player:{x:2,y:4}, box:{x:2,y:3} },
      { name:"Turn the corner", map:["######", "#....#", "#....#", "#....#", "#...G#", "######"], player:{x:1,y:2}, box:{x:2,y:2} }
    ];
    const board = document.querySelector("#board");
    const status = document.querySelector("#status");
    const movesLabel = document.querySelector("#moves");
    const levelLabel = document.querySelector("#level-label");
    const nextButton = document.querySelector("#next");
    let levelIndex = 0, level, player, box, moves, history, won;
    const start = () => {
      level = scenarios[levelIndex].map;
      player = {...scenarios[levelIndex].player}; box = {...scenarios[levelIndex].box};
      moves = 0; history = []; won = false;
      status.textContent = "Ready when you are!";
      levelLabel.textContent = `Puzzle ${levelIndex + 1} of ${scenarios.length}: ${scenarios[levelIndex].name}`;
      nextButton.hidden = true;
      render();
    };
    const isWall = (x, y) => !level[y] || level[y][x] === undefined || level[y][x] === "#";
    function render() {
      board.replaceChildren();
      for (let y = 0; y < level.length; y++) for (let x = 0; x < level[y].length; x++) {
        const cell = document.createElement("div");
        cell.className = "cell"; cell.setAttribute("role", "gridcell");
        if (isWall(x,y)) cell.classList.add("wall");
        if (level[y][x] === "G") cell.classList.add("goal");
        if (box.x === x && box.y === y) { const block = document.createElement("span"); block.className = "box"; block.setAttribute("aria-label", "wooden block"); cell.append(block); }
        if (player.x === x && player.y === y) { const buddy = document.createElement("span"); buddy.className = "player" + (level[y][x] === "G" ? " on-goal" : ""); buddy.setAttribute("aria-label", "player"); cell.append(buddy); }
        board.append(cell);
      }
      movesLabel.textContent = `Moves: ${moves}`;
    }
    function move(dx, dy) {
      if (won) return;
      const nx = player.x + dx, ny = player.y + dy;
      if (isWall(nx,ny)) return;
      const pushing = nx === box.x && ny === box.y;
      if (pushing && (isWall(box.x + dx, box.y + dy) || (box.x + dx === player.x && box.y + dy === player.y))) return;
      history.push({ player: {...player}, box: {...box}, moves });
      if (pushing) box = { x: box.x + dx, y: box.y + dy };
      player = { x:nx, y:ny }; moves++;
      if (level[box.y][box.x] === "G") {
        won = true;
        const lastLevel = levelIndex === scenarios.length - 1;
        status.textContent = lastLevel ? `All 5 puzzles solved! Amazing! 🎉` : `Puzzle solved in ${moves} moves! 🎉`;
        nextButton.textContent = lastLevel ? "Play again ↻" : "Next puzzle →";
        nextButton.hidden = false;
      }
      else status.textContent = pushing ? "Nice push!" : "Keep going!";
      render();
    }
    function undo() {
      if (!history.length || won) return;
      const previous = history.pop(); player = previous.player; box = previous.box; moves = previous.moves;
      status.textContent = "Undid that move."; render();
    }
    const directions = { ArrowUp:[0,-1], w:[0,-1], ArrowDown:[0,1], s:[0,1], ArrowLeft:[-1,0], a:[-1,0], ArrowRight:[1,0], d:[1,0] };
    addEventListener("keydown", event => {
      if (event.key.toLowerCase() === "r") { start(); return; }
      const direction = directions[event.key] || directions[event.key.toLowerCase()];
      if (direction) { event.preventDefault(); move(...direction); }
      if (event.key === "Backspace" || event.key.toLowerCase() === "z") { event.preventDefault(); undo(); }
    });
    document.querySelectorAll("[data-dir]").forEach(button => button.addEventListener("click", () => {
      const movesByDir = { up:[0,-1], down:[0,1], left:[-1,0], right:[1,0] }; move(...movesByDir[button.dataset.dir]);
    }));
    document.querySelector("#undo").addEventListener("click", undo);
    document.querySelector("#reset").addEventListener("click", start);
    nextButton.addEventListener("click", () => {
      if (levelIndex === scenarios.length - 1) levelIndex = 0;
      else levelIndex++;
      start();
    });
    start();
  </script>
</body>
</html>
